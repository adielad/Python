version: "3.9"
services:
  web:
    build: .
    container_name: django-sql-viewer
    ports:
      - "8000:8000"
    environment:
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: "dev"
      # Set these to connect to an external SQL Server
      # MSSQL_SERVER: "sqlserver"
      # MSSQL_DATABASE: "master"
      # MSSQL_USER: "sa"
      # MSSQL_PASSWORD: "YourStrong@Passw0rd"
      # MSSQL_PORT: "1433"
      # MSSQL_ODBC_DRIVER: "ODBC Driver 18 for SQL Server"
      # MSSQL_TRUST_CERT: "yes"
    volumes:
      - .:/app
    depends_on: []

  # Example SQL Server service (Linux) — uncomment to run locally
  # sqlserver:
  #   image: mcr.microsoft.com/mssql/server:2022-latest
  #   container_name: mssql
  #   ports:
  #     - "1433:1433"
  #   environment:
  #     ACCEPT_EULA: "Y"
  #     MSSQL_SA_PASSWORD: "YourStrong@Passw0rd"
  #   healthcheck:
  #     test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "YourStrong@Passw0rd", "-Q", "SELECT 1"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 10
